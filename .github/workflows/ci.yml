name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: grep -E '^[A-Z_]+=' config/versions.env >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install -r requirements/dev.txt
          # torch and safetensors for the checkpoint converter tests.
          python -m pip install "$(grep -E '^torch==' requirements/export-xnnpack.txt)" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(grep -E '^safetensors==' requirements/export-xnnpack.txt)" numpy

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
