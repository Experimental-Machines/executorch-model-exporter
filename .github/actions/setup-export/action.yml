name: Set up export host
description: Free disk, add swap, install the pinned Python toolchain for an ExecuTorch export.

inputs:
  swap-gib:
    description: Size of the swap file in GiB.
    default: "24"
  requirements:
    description: Requirements file with the pinned toolchain.
    default: requirements/export-xnnpack.txt

runs:
  using: composite
  steps:
    - name: Prepare host
      shell: bash
      run: bash scripts/ci/prepare-host.sh "${{ inputs.swap-gib }}"

    - name: Read versions
      id: versions
      shell: bash
      run: grep -E '^[A-Z_]+=' config/versions.env >>"$GITHUB_OUTPUT"

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements }}

    - name: Install toolchain
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        # torch (and torchvision, where pinned) from the CPU index: the PyPI Linux wheels pull
        # gigabytes of CUDA libraries.
        cpu_pins=$(grep -E '^(torch|torchvision)==' "$REQUIREMENTS" || true)
        python -m pip install --upgrade pip
        if [ -n "$cpu_pins" ]; then
          python -m pip install $cpu_pins --index-url https://download.pytorch.org/whl/cpu
        fi
        python -m pip install -r "$REQUIREMENTS"
        python -m pip list | grep -iE '^(torch|torchao|executorch|transformers|huggingface.hub) ' || true
